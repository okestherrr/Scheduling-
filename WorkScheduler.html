<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Employee Details</title>
    <link rel="stylesheet" href="./employeeDetails.css" />
    <script src="./employeeDetails.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <div class="top-home-row">
        <a class="btn-main mode-switch-btn" href="./homepage.html">Home</a>
        <a class="btn-main mode-switch-btn" href="./homepage.html?view=course">Course Scheduling</a>
        <a class="btn-main mode-switch-btn" href="./ShiftDetails.html">Shift Details</a>
      </div>

      <section class="hero" id="employeeHero">
        <div class="work-title-row">
          <h1>Employee Details</h1>
          <button id="employeeTestingBtn" class="btn-main work-link-btn" type="button">Testing</button>
        </div>
        <p>Add employees first, then continue to Shift Details to generate the schedule.</p>

        <div id="employeeList"></div>
        <div class="request-row work-actions-row">
          <button id="addEmployeeBtn" class="btn-main work-link-btn" type="button">Add person</button>
          <button id="goToShiftDetailsBtn" class="btn-main" type="button">Next: Shift Details</button>
        </div>

        <p id="employeeMessage"></p>
      </section>
    </main>
  </body>
</html>
