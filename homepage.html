<!DOCTYPE html>
<html>
    <head>
      <title>Class Scheduler</title>
      <link rel="stylesheet" href="/index.css" />
      <script src="https://www.gstatic.com/firebasejs/9.25.0/firebase-app-compat.js"></script>
      <script src="https://www.gstatic.com/firebasejs/9.25.0/firebase-firestore-compat.js"></script>
      <script src="/config.js"></script>
      <script src="/homepage.js" defer></script>
    </head>
      <body>
        <h1>Your Class Scheduler</h1>
        <div>
          <label for="classRequest">Enter class codes(comma separated):</label>
          <input id="classRequest" type="text" placeholder="Abc123,456" />
          <button id="generateBtn" type="button">Get My Schedule</button>
            </div>
               <p id="requestMessage"></p>
            <h2>Schedule options</h2>
              <div id="scheduleOptions"></div>
            <h2>Selected classes:</h2>
               <div id="selectedSections"></div>
            <h2>Potential schedules:</h2>
          <div id="scheduleGrid"></div>
          <div id="courses"></div>
        </body>
</html>
