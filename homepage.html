<!DOCTYPE html>
<html>
  <head>
    <title>Class Scheduler</title>
    <link rel="stylesheet" href="./homepage.css" />
    <script src="https://www.gstatic.com/firebasejs/9.25.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.25.0/firebase-firestore-compat.js"></script>
    <script src="./config.js"></script>
    <script src="./homepage.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <h1>Your Class Scheduler</h1>
        <p class="hero-copy">Build schedule options and view each result in a weekly calendar.</p>

        <label for="classRequest">Enter class codes (comma separated):</label>
        <div class="request-row course-request-row">
          <div class="class-search-input-wrap">
            <input id="classRequest" type="text" placeholder="CSE210,MATH119" />
            <button id="classClearBtn" type="button" aria-label="Clear class search">X</button>
          </div>
          <button id="generateBtn" type="button">Get My Schedule</button>
          <button id="detailsBtn" type="button">Details</button>
          <button id="teacherBtn" type="button">Teachers</button>
        </div>

        <div id="detailsPanel" hidden>
          <div id="termSearchPanel" class="term-row">
            <label for="termInput">Term number:</label>
            <input id="termInput" type="number" min="1" step="1" placeholder="Term #" />
          </div>

          <div id="teacherSearchPanel" hidden>
            <label for="teacherRequest">Teacher Search:</label>
            <div class="request-row">
              <div class="teacher-search-input-wrap">
                <input id="teacherRequest" type="text" placeholder="Start typing a teacher name" />
                <button id="teacherClearBtn" type="button" aria-label="Clear teacher search">X</button>
              </div>
              <button id="teacherSearchBtn" type="button">Find Teachers</button>
            </div>
          </div>
        </div>
        <p id="requestMessage"></p>
        <p id="teacherMessage"></p>
        <div id="teacherResults"></div>
      </section>

      <section class="results-panel">
        <div class="schedule-options-header">
          <h2>Schedule Options</h2>
          <div class="schedule-options-actions">
            <button id="manipulateBtn" type="button" hidden>Manipulate</button>
            <button id="resetManipulatedBtn" type="button" hidden>Reset</button>
            <button id="loadMoreBtn" type="button" hidden>Load More</button>
          </div>
        </div>
        <div id="scheduleOptions"></div>

        <h2>Selected Classes</h2>
        <div id="selectedSections"></div>

        <h2>Weekly Calendar</h2>
        <div id="scheduleGrid"></div>
      </section>
    </main>
  </body>
</html>
